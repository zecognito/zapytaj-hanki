name: Hanka Brain Expansion Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hanka-ai/tools/import-wikidata
    steps:
      - name: Check out Hanka AI branch
        uses: actions/checkout@v4
        with:
          ref: feature/hanka-ai

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install importer dependencies
        run: npm install --ignore-scripts

      - name: Validate importer configuration
        run: npm run validate:config

      - name: Acquire bounded source cache
        run: npm run acquire

      - name: Build candidates from cache
        run: npm run build:cache

      - name: Validate staged records
        run: npm run validate

      - name: Run quality gate
        id: quality
        continue-on-error: true
        run: npm run quality

      - name: Ensure review report exists
        if: always()
        shell: bash
        run: |
          test -f review-report.json || printf '%s\n' '{"generated":null,"summary":{"total":0,"pass":0,"hold":0},"records":[],"error":"quality gate did not produce report"}' > review-report.json

      - name: Summarize pipeline
        shell: bash
        run: |
          count=$(find staging -type f -name '*.json' | wc -l)
          echo "### Hanka Brain expansion pipeline" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source branch: feature/hanka-ai" >> "$GITHUB_STEP_SUMMARY"
          echo "- Acquisition: bounded cache-first" >> "$GITHUB_STEP_SUMMARY"
          echo "- Staged candidates: $count" >> "$GITHUB_STEP_SUMMARY"
          echo "- Quality report generated: yes" >> "$GITHUB_STEP_SUMMARY"
          echo "- Canonical Brain modified: no" >> "$GITHUB_STEP_SUMMARY"
          echo "- Vectorize modified: no" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidates and review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hanka-brain-expansion
          path: |
            hanka-ai/tools/import-wikidata/staging/**/*.json
            hanka-ai/tools/import-wikidata/review-report.json
            hanka-ai/tools/import-wikidata/cache/**/*.json
          if-no-files-found: error
          retention-days: 7
