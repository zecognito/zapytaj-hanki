name: Build Newsy archives

on:
  push:
    branches: [main]
    paths:
      - 'newsy/articles.json'
      - 'newsy/*/index.html'
      - 'scripts/build_newsy.py'
      - '.github/workflows/newsy-archives.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: newsy-archive-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Generate static archive pages and sitemap
        run: python3 scripts/build_newsy.py
      - name: Commit generated archive changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add newsy/index.html newsy/strona/ sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Generate Newsy archives and sitemap"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
