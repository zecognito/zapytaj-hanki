name: Update recipe listings
on:
  push:
    branches: [main]
    paths:
      - 'przepisy/**/index.html'
      - 'przepisy/images/**'
      - 'scripts/build_recipe_feed.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_recipe_feed.py
      - name: Commit recipe list if changed
        run: |
          if ! git diff --quiet -- przepisy/articles.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add przepisy/articles.json
            git commit -m "Auto-update recipe listing"
            git push origin HEAD:main
          fi
